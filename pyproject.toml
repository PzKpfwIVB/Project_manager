[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
packages = [{ include = "application" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["application*"]

[project]
name = "task-manager-2026"
version = "1.0.0"
description = "A task management web app."
authors = [{ name = "Mihaly Konda" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.138.0",
    "httpx2==2.4.0",
    "jinja2==3.1.6",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic[email]==2.13.4",
    "PyJWT==2.13.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "pwdlib==0.3.0",
    "pwdlib[argon2]==0.3.0",
    "starlette==1.3.1",
    "sqlalchemy==2.0.51",
    "uvicorn==0.49.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "tox==4.56.4"
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*The `from_orm` method is deprecated.*",
    "ignore:.*coroutine 'UploadFile.close' was never awaited.*"
]

[tool.tox]
legacy_tox_ini = false
env_list = ["testenv"]

[tool.tox.env.testenv]
description = "Run pytest"
deps = [
  ".[dev]",
]
commands = [
  ["python", "application/db/declarative_mapping.py"],
  ["python", "application/db/load_db_with_dummy_data.py"],
  ["pytest", "-v", "tests"],
]